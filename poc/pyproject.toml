[project]
name = "receipt-pal-poc"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "openai-agents>=0.0.15",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "psycopg2-binary>=2.9.11",
]

[project.scripts]
receipt-pal = "receipt_pal_cli:chat_loop"
receipt-pal-analytics = "analytics_cli:main"
