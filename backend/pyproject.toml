[project]
name = "receipt-pal-backend"
version = "0.1.0"
description = "Receipt Pal Telegram Bot Backend"
requires-python = ">=3.10"
dependencies = [
    "aiogram[redis]>=3.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "openai-agents[sqlalchemy]>=0.1.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "rocksdict>=0.3.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest_asyncio]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
